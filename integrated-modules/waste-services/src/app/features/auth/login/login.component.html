<div class="login-container">
    <mat-card class="login-card fade-in">
        <div class="logo-section">
            <mat-icon class="logo-icon">delete</mat-icon>
            <h1>WasteCheck</h1>
            <p class="subtitle">Waste Management System</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <mat-form-field appearance="outline">
                <mat-label>Email</mat-label>
                <input matInput type="email" formControlName="email" placeholder="Enter your email">
                <mat-icon matPrefix>email</mat-icon>
                <mat-error *ngIf="emailControl?.hasError('required')">Email is required</mat-error>
                <mat-error *ngIf="emailControl?.hasError('email')">Invalid email format</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Password</mat-label>
                <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password"
                    placeholder="Enter your password">
                <mat-icon matPrefix>lock</mat-icon>
                <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
                    <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
                <mat-error *ngIf="passwordControl?.hasError('required')">Password is required</mat-error>
            </mat-form-field>

            <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid || loading"
                class="submit-btn">
                <span *ngIf="!loading">Login</span>
                <span *ngIf="loading">Logging in...</span>
            </button>
        </form>

        <div class="footer-links">
            <p>Don't have an account? <a routerLink="/register">Register here</a></p>
        </div>

        <div class="demo-credentials">
            <p class="demo-title">Demo Credentials:</p>
            <div class="demo-info">
                <div>
                    <strong>Admin:</strong> admin&#64;waste.com / admin123
                </div>
                <div>
                    <strong>User:</strong> user&#64;waste.com / user123
                </div>
            </div>
        </div>
    </mat-card>
</div>
