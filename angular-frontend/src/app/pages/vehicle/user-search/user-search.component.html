<div class="h-screen flex flex-col">
    <!-- Header -->
    <div class="bg-white shadow z-10 p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-gray-800">Find a Ride</h1>
        <div class="flex gap-4 items-center">
            <select (change)="onFilterChange($event)"
                class="border rounded-lg px-3 py-1 text-sm bg-gray-50 focus:ring-2 focus:ring-indigo-500">
                <option value="">All Vehicles</option>
                <option value="Auto">Auto</option>
                <option value="Taxi">Taxi</option>
                <option value="Ambulance">Ambulance</option>
                <option value="Bus">Bus</option>
            </select>
        </div>
    </div>

    <!-- Map Container -->
    <div class="flex-grow relative">
        <div id="map" class="h-full w-full z-0"></div>

        <!-- Loading Overlay -->
        <div *ngIf="isLoading"
            class="absolute inset-0 bg-white/80 z-30 flex items-center justify-center backdrop-blur-sm">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-indigo-500 border-t-transparent"></div>
        </div>

        <!-- Vehicle List Overlay (Bottom Sheet Style) -->
        <div
            class="absolute bottom-4 left-4 right-4 bg-white rounded-xl shadow-2xl p-4 max-h-64 overflow-y-auto z-20 md:w-96 md:bottom-8 md:left-8 md:right-auto">
            <h3 class="font-bold text-gray-700 mb-3 sticky top-0 bg-white">Available Vehicles ({{ vehicles.length }})
            </h3>

            <div *ngIf="vehicles.length === 0" class="text-center text-gray-500 py-4">
                No vehicles found nearby.
            </div>

            <div *ngFor="let vehicle of vehicles"
                class="flex justify-between items-center border-b py-3 last:border-0 hover:bg-gray-50 transition p-2 rounded cursor-pointer"
                (click)="flyToVehicle(vehicle)">
                <div>
                    <div class="font-bold text-gray-800 flex items-center gap-2">
                        {{ vehicle.type }}
                        <span class="text-xs font-normal bg-gray-100 px-2 rounded">{{ vehicle.registrationNumber
                            }}</span>
                    </div>
                    <div class="text-xs text-gray-500">Driver: {{ vehicle.driverName }}</div>
                </div>
                <button (click)="bookVehicle(vehicle)"
                    class="bg-indigo-600 text-white text-xs px-3 py-2 rounded-lg hover:bg-indigo-700 transition">
                    Book
                </button>
            </div>
        </div>
    </div>

    <!-- SOS Button -->
    <app-emergency-sos></app-emergency-sos>

    <!-- Booking Modal -->
    <div *ngIf="selectedVehicle" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md">
            <h3 class="text-xl font-bold text-gray-800 mb-4">Book Ride</h3>

            <div class="mb-4 bg-indigo-50 p-3 rounded-lg">
                <p class="font-bold text-indigo-900">{{ selectedVehicle.type }}</p>
                <p class="text-sm text-indigo-700">{{ selectedVehicle.registrationNumber }}</p>
                <p class="text-xs text-indigo-600">Driver: {{ selectedVehicle.driverName }}</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Source</label>
                    <input type="text" [(ngModel)]="bookingData.source"
                        class="w-full border rounded px-3 py-2 bg-gray-100" readonly>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Destination</label>
                    <input type="text" [(ngModel)]="bookingData.destination" placeholder="Where do you want to go?"
                        class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Time</label>
                    <input type="datetime-local" [(ngModel)]="bookingData.bookingTime"
                        class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6">
                <button (click)="closeBookingModal()"
                    class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">Cancel</button>
                <button (click)="confirmBooking()"
                    class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-medium">Confirm
                    Request</button>
            </div>
        </div>
    </div>
</div>
