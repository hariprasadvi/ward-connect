<div class="fixed bottom-6 right-6 z-50">
    <button (click)="triggerSOS()" [disabled]="isProcessing"
        class="bg-red-600 hover:bg-red-700 text-white font-bold py-4 px-6 rounded-full shadow-lg text-lg animate-pulse flex items-center gap-2 transform hover:scale-105 transition duration-200">
        <span *ngIf="!isProcessing" class="material-icons">SOS</span>
        <span *ngIf="!isProcessing">EMERGENCY RIDE</span>
        <span *ngIf="isProcessing">Dispatching...</span>
    </button>
</div>

<!-- Emergency Status Modal -->
<div *ngIf="sosStatus" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center">
        <div class="mb-4">
            <svg class="w-16 h-16 text-green-500 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
        <h3 class="text-2xl font-bold text-gray-800 mb-2">Help is On The Way!</h3>
        <p class="text-gray-600 mb-6">{{ sosStatus }}</p>

        <div *ngIf="dispatchedVehicle" class="bg-gray-50 p-4 rounded-lg text-left mb-6">
            <p class="font-bold text-gray-800">Vehicle: {{ dispatchedVehicle.type }}</p>
            <p class="text-gray-600">Reg: {{ dispatchedVehicle.registrationNumber }}</p>
            <p class="text-gray-600">Driver: {{ dispatchedVehicle.driverName }}</p>
            <p class="text-indigo-600 font-bold mt-2">Contact: {{ dispatchedVehicle.contactNumber }}</p>
        </div>

        <button (click)="closeModal()"
            class="bg-gray-800 text-white px-6 py-2 rounded-lg hover:bg-gray-900 transition w-full">
            Close
        </button>
    </div>
</div>
