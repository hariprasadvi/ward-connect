<div class="health-container">
  <div class="content-wrapper">
    <header>
      <h1 class="heading-main">
        Your Health, <span class="text-gradient">Reimagined</span>
      </h1>
      <p class="subtext">
        The complete ecosystem for personal and community wellbeing. Secure, simple, and vital.
      </p>
    </header>

    <div class="card-grid">
      <a *ngFor="let card of cards" [routerLink]="card.to" style="text-decoration: none; color: inherit;">
        <div class="card">
          <div class="icon-wrapper" [style.background-color]="'color-mix(in srgb, ' + card.color + ', transparent 85%)'"
            [style.color]="card.color">
            <mat-icon style="width: 36px; height: 36px; font-size: 36px;">{{card.icon}}</mat-icon>
          </div>
          <h2 class="card-title">{{card.title}}</h2>
          <p class="card-desc">{{card.desc}}</p>
          <div class="access-link" [style.color]="card.color">
            Access Module <span>&rarr;</span>
          </div>
        </div>
      </a>
    </div>
  </div>

  <footer>
    © 2026 WardConnect Health Services. All rights reserved.
  </footer>
</div>
