<div class="utility-container">
    <div class="header">
        <h1>Utility Bill Payments</h1>
        <p>Manage and pay your electricity, water, and gas bills seamlessly.</p>
        <div style="margin-top: 10px; display: flex; justify-content: space-between; align-items: center;">
            <p>Total Due: <strong style="color: #e74c3c;">₹{{ totalDue | number:'1.2-2' }}</strong></p>
            <button
                style="padding: 8px 16px; background: #34495e; color: white; border: none; border-radius: 4px; cursor: pointer;"
                routerLink="history">View History</button>
        </div>
    </div>

    <!-- 3 Cards -->
    <div class="services-grid">
        <div class="service-card" [class.active]="selectedType === 'Electricity'" (click)="filterBills('Electricity')">
            <div class="icon-box">⚡</div>
            <h3>Electricity</h3>
            <span style="font-size: 0.8em; color: gray;">KSEB</span>
        </div>
        <div class="service-card" [class.active]="selectedType === 'Water'" (click)="filterBills('Water')">
            <div class="icon-box">💧</div>
            <h3>Water</h3>
            <span style="font-size: 0.8em; color: gray;">KWA</span>
        </div>
        <div class="service-card" [class.active]="selectedType === 'Gas'" (click)="filterBills('Gas')">
            <div class="icon-box">🔥</div>
            <h3>Gas</h3>
            <span style="font-size: 0.8em; color: gray;">Pipeline</span>
        </div>
    </div>

    <!-- Selected Bills List -->
    <!-- Selected Bills List Removed -->
</div>
